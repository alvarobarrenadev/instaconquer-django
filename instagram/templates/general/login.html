{% extends "general/layout.html" %}

{% block head_title %}Iniciar sesión · InstaConquer{% endblock %}

{% block page_content %}
<section class="form-layout" aria-labelledby="login-title">
  <header class="page-heading">
    <h1 id="login-title">Iniciar sesión</h1>
    <p>¿Buscas crear una cuenta? <a class="text-link" href="{% url 'register' %}">Regístrate</a></p>
  </header>

  <form method="post" class="form-panel">
    {% csrf_token %}
    {% include '_includes/_fields.html' %}
    <button class="button" type="submit">Iniciar sesión</button>
  </form>
</section>
{% endblock %}
