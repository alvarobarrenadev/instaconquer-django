{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Comparte fotos y sigue las publicaciones de otros perfiles en InstaConquer.">
  <title>{% block head_title %}InstaConquer{% endblock %}</title>
  <link rel="icon" href="{% static 'instaconquer/favicon.png' %}" type="image/png">
  <link rel="stylesheet" href="{% static 'instaconquer/app.css' %}">
  <script src="{% static 'instaconquer/app.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Ir al contenido</a>
  {% include '_includes/_header.html' %}
  <main id="contenido" class="shell" tabindex="-1">
    {% include '_includes/_messages.html' %}
    {% block page_content %}{% endblock %}
  </main>
  {% include '_includes/_footer.html' %}
</body>
</html>
