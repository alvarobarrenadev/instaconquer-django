{% if messages %}
  <div class="messages">
    {% for message in messages %}
      <p class="notice{% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %} notice-error{% endif %}" role="{% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}alert{% else %}status{% endif %}">
        {{ message }}
      </p>
    {% endfor %}
  </div>
{% endif %}
